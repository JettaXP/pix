<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Фронт Евразии</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Фронт Евразии — пиксельная военная стратегия. Тёмная палитра задана один раз: игра намеренно в одном стиле. */
:root{
  --bg:#060a18; --ocean:#0c1a38; --panel:#141b38; --panel2:#1f2a54; --panel3:#0d1228;
  --ink:#eaf0ff; --dim:#8c98c6; --edge:#000;
  --hi:#ffb000; --ok:#41d98a; --bad:#ff4d4d; --info:#4cc9f0; --nuke:#c04dff;
  --px:'Press Start 2P','Courier New',monospace;
  --body:'VT323','Courier New',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--body);font-size:20px;line-height:1.05;user-select:none;-webkit-user-select:none;touch-action:none}
#app{position:fixed;inset:0;background:var(--ocean)}
#stage{position:absolute;inset:0}
#map{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:crosshair}
img.ico{width:16px;height:16px;image-rendering:pixelated;vertical-align:-3px}
img.ico.l{width:24px;height:24px;vertical-align:-6px}
.pxbox{background:var(--panel);border:4px solid var(--edge);box-shadow:inset 4px 4px 0 var(--panel2),inset -4px -4px 0 var(--panel3)}
.btn{font:10px/1.2 var(--px);color:var(--ink);background:var(--panel2);border:3px solid var(--edge);padding:9px 10px;cursor:pointer;
  box-shadow:inset 2px 2px 0 #ffffff33,inset -2px -2px 0 #00000066;text-align:center;white-space:nowrap}
.btn:hover{background:#2a3870}
.btn:active{transform:translate(2px,2px)}
.btn.hi{background:var(--hi);color:#1a1000;box-shadow:inset 2px 2px 0 #fff8,inset -2px -2px 0 #0004}
.btn.bad{background:#a42828}
.btn.ok{background:#1f7a4a}
.btn.sel{background:var(--hi);color:#1a1000}
.btn[disabled],.btn.off{opacity:.38;pointer-events:none}
.btn.sm{padding:6px 7px;font-size:9px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto}
h2,h3{font:11px/1.4 var(--px);margin:0 0 8px;color:var(--hi);letter-spacing:.5px}
.dim{color:var(--dim)}
.good{color:var(--ok)} .badc{color:var(--bad)} .info{color:var(--info)}

/* HUD */
#topstack{position:absolute;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));z-index:5;display:flex;flex-direction:column;gap:6px;align-items:flex-start;pointer-events:none}
#topstack>*{pointer-events:auto}
#hud{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:8px 10px;width:100%}
#hud .chip{display:flex;align-items:center;gap:6px;font-size:20px;white-space:nowrap}
#hud .swatch{width:18px;height:18px;border:3px solid #000;box-shadow:inset 0 0 0 2px #fff4}
#hud .who{font:10px var(--px);max-width:170px;overflow:hidden;text-overflow:ellipsis}
#hud .res{display:flex;gap:12px;flex-wrap:wrap}
#hud .res span small{color:var(--dim);font-size:16px}
#speed{display:flex;gap:4px;margin-left:auto}
#speed .btn{padding:7px 8px;min-width:34px}

/* Panel */
#panel{position:absolute;z-index:6;display:flex;flex-direction:column;overflow:hidden}
@media (min-width:900px){#panel{top:calc(78px + env(safe-area-inset-top,0px));right:8px;bottom:8px;width:392px}}
@media (max-width:899px){#panel{left:6px;right:6px;bottom:calc(6px + env(safe-area-inset-bottom,0px));max-height:42%}body.mode #panel{display:none}}
@media (max-width:620px){#hud{padding:6px 8px;gap:4px 8px}#hud .chip{font-size:17px}#hud .who{font-size:9px;max-width:120px}#hud .dt{display:none}#speed .btn{padding:6px 6px;min-width:28px;font-size:9px}#hud .res{gap:8px}#hud .btn{padding:7px 8px}}
#panel .ph{display:flex;gap:8px;align-items:center;padding:6px 8px 4px}
#panel .ph .nm{font:11px/1.3 var(--px);flex:1;min-width:0}
#panel .tabs{display:flex;gap:4px;padding:0 8px 6px;flex-wrap:wrap}
#panel .body{overflow-y:auto;padding:2px 10px 10px;flex:1;touch-action:pan-y}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kv{display:flex;justify-content:space-between;gap:8px;border-bottom:2px dotted #ffffff1a;padding:2px 0}
.card{background:var(--panel3);border:3px solid #000;padding:6px 8px;margin-bottom:6px}
.card .t{font:9px/1.4 var(--px);color:var(--ink);margin-bottom:4px}
.bar{height:10px;background:#000;border:2px solid #000;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ok)}
.cost{font-size:18px;color:var(--dim)}
.cost.no{color:var(--bad)}
.item{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.item .meta{flex:1;min-width:0}
.item .meta b{font:9px/1.4 var(--px);font-weight:normal;display:block}
.tag{font:8px var(--px);padding:3px 4px;background:#000;color:var(--hi);display:inline-block}

#strikebar{display:flex;gap:6px;flex-wrap:wrap;padding:6px;max-width:100%;align-items:center}
#modebar{padding:8px 10px;text-align:center;max-width:100%;align-self:center}
#modebar .t{font:10px/1.5 var(--px);margin-bottom:6px}
#toasts{display:flex;flex-direction:column;gap:5px;max-width:min(430px,100%);pointer-events:none!important}
#toasts .ts{padding:6px 9px;background:#000c;border-left:6px solid var(--info);font-size:19px;pointer-events:auto;animation:tin .15s steps(3)}
#toasts .ts.war{border-color:var(--bad)} #toasts .ts.good{border-color:var(--ok)} #toasts .ts.nuke{border-color:var(--nuke)}
#toasts .ts .row{margin-top:4px}
@keyframes tin{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}

/* Modal */
#modal{position:absolute;inset:0;z-index:20;background:#000a;display:flex;align-items:center;justify-content:center;padding:10px}
#modal .win{width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
#modal .wh{display:flex;gap:8px;align-items:center;padding:8px 12px 2px}
#modal .wh h2{flex:1;margin:0;font-size:12px}
#modal .wb{overflow-y:auto;padding:8px 14px 14px;touch-action:pan-y}
.logo{font:16px/1.5 var(--px);color:var(--hi);text-shadow:3px 3px 0 #000;margin:4px 0 2px}
.logo small{display:block;font-size:9px;color:var(--ink);text-shadow:none;margin-top:4px}
.clist{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;max-height:34vh;overflow-y:auto;padding:2px;touch-action:pan-y}
.clist .btn{display:flex;gap:6px;align-items:center;text-align:left;white-space:normal;font-size:9px}
.clist .btn i{width:12px;height:12px;border:2px solid #000;flex:none}
input[type=text],textarea,input[type=search]{font:20px var(--body);color:var(--ink);background:#000;border:3px solid #000;padding:6px 8px;width:100%;box-shadow:inset 0 0 0 2px var(--panel2);user-select:text;-webkit-user-select:text}
textarea{height:110px;resize:vertical;font-size:16px}
.bk{display:flex;gap:8px;align-items:center;border-bottom:2px dotted #ffffff22;padding:6px 0;flex-wrap:wrap}
.bk .m{flex:1;min-width:180px}
.bk .m b{font:9px/1.4 var(--px);font-weight:normal;display:block}
.note{font-size:18px;color:var(--dim);margin:6px 0}
.hint{font-size:18px;color:var(--dim)}
kbd{font:9px var(--px);background:#000;padding:2px 4px;border:2px solid #333}

[hidden]{display:none!important}



/* v2 */
img.flag{width:24px;height:16px;image-rendering:pixelated;vertical-align:-3px;border:2px solid #000;flex:none}
.clist img.flag{width:18px;height:12px}
.chipu{display:inline-flex;align-items:center;gap:3px;margin-right:8px;white-space:nowrap}
.dim.sm{font-size:16px;line-height:1}
.nukec{color:var(--nuke)}
.hl{color:var(--hi);font:9px var(--px);font-weight:normal}
.item .btn{flex:none;max-width:118px;white-space:normal}
#panel .ph .nm small{font:16px var(--body)}
#hud .res span{display:inline-flex;align-items:center;gap:3px}
#modal .wb p{margin:0 0 10px}
@media (max-width:899px){#panel{max-height:48%}}

</style>
</head><body>

// ---------- тосты ----------
function toast(text, kind, ci, quiet, offerIdx) {
  const box = $('#toasts'), el = document.createElement('div'); el.className = 'ts ' + (kind === 'offer' ? 'good' : kind || '');
  let h = esc(text);
  if (kind === 'offer' && S.offers[offerIdx]) { const o = S.offers[offerIdx]; h += `<div class="row"><button class="btn sm ok" data-a="offer:${o.from}:${o.t}:1">ПРИНЯТЬ</button><button class="btn sm bad" data-a="offer:${o.from}:${o.t}:0">ОТКАЗ</button></div>`; }
  el.innerHTML = h; if (ci != null && ci >= 0) { el.dataset.c = ci; el.style.cursor = 'pointer'; }
  box.appendChild(el); while (box.children.length > 5) box.firstChild.remove();
  setTimeout(() => el.remove(), kind === 'offer' ? 14000 : kind === 'nuke' || kind === 'war' ? 8000 : 5000);
  if (!quiet) SFX.play(kind === 'war' ? 'alert' : kind === 'nuke' ? 'siren' : kind === 'offer' ? 'ping' : kind === 'good' ? 'done' : 'ping');
}

function selectCity(ci) { UI.sel = ci; UI.lastP = ''; if (ci >= 0) SFX.play('click'); refresh(true); }
function trySend(from, to, share) { const e = sendArmy(S.player, from, to, share); if (e) note(e); else { SFX.play('ping'); note(`Войска вышли: ${W.C0[from].n} → ${W.C0[to].n}`); } refresh(true); return !e; }
function act(a, el) {
  const [cmd, x, y, z2] = a.split(':'), p = S ? S.player : -1, ci = UI.sel; SFX.init(); let err = '';
  switch (cmd) {
    case 'speed': S.speed = +x; if (S.over === -1) S.speed = 0; break;
    case 'menu': openMenu(S ? (S.offers.length ? 'dip' : UI.mtab === 'new' ? 'state' : UI.mtab) : 'new'); break;
    case 'mtab': UI.mtab = x; UI.dipF = -1; renderMenu(); break;
    case 'close': closeModal(); break;
    case 'newgame': UI.mtab = 'new'; UI.modal = 'menu'; UI.lastM = ''; renderMenu(); break;
    case 'home': if (S.F[p].cap >= 0) { focusCity(S.F[p].cap, 3.5); selectCity(S.F[p].cap); } break;
    case 'pick': UI.pick = +x; UI.keepScroll = 1; if (!S || UI.mtab === 'new') { const cp = W.capOf[+x]; if (cp >= 0) { V.z = Math.max(V.z, 1.2); focusCity(cp); } } renderMenu(); break;

    case 'begin': if (UI.pick >= 0) startNew(UI.pick, UI.diff); break;
    case 'tab': UI.tab = x; break;
    case 'bcat': UI.bcat = x; break;
    case 'fold': UI.fold = x; break;
    case 'prio': UI.prio = x || ''; break;
    case 'unsel': UI.sel = -1; UI.mode = null; break;
    case 'focus': focusCity(+x, 4); break;
    case 'goto': closeModal(); focusCity(+x, 3.5); selectCity(+x); break;
    case 'gotof': { const f = +x; closeModal(); if (S.F[f].cap >= 0) { focusCity(S.F[f].cap, 2); selectCity(S.F[f].cap); UI.tab = 'dip'; } break; }
    case 'build': err = orderBuild(ci, +x); if (!err) SFX.play('done'); break;
    case 'demol': demolish(ci, +x); break;
    case 'cancel': cancelOrder(ci, x, +y); break;
    case 'unit': err = orderUnit(ci, +x); if (!err) SFX.play('ping'); break;
    case 'prod': err = orderProd(ci, x, +y, +z2); if (!err) SFX.play('ping'); break;
    case 'send': UI.mode = { t: 'move', from: ci }; break;
    case 'share': UI.share = +x; break;
    case 'mode-cancel': UI.mode = null; break;
    case 'sendfrom': trySend(+x, ci, +y); break;
    case 'strike': { const w = WPN[+x], n = launch(p, +x, ci, +y, UI.prio); if (!n) err = 'Пуск невозможен: нет площадки в радиусе или лимит пусков на сегодня'; else note(`Пуск: ${w.n} ×${n} → ${W.C0[ci].n}`); break; }
    case 'dip': { if (x != null && y === 'war' && !el.dataset.sure) { el.dataset.sure = 1; el.textContent = 'ТОЧНО? НАЖМИТЕ ЕЩЁ РАЗ'; UI.held = true; setTimeout(() => { UI.held = false; }, 2500); return; } UI.held = false; const r = propose(+x, y); if (r) note(r); if (UI.modal === 'menu') { UI.lastM = ''; renderMenu(true); } break; }
    case 'dipsel': UI.dipF = +x; UI.lastM = ''; renderMenu(); break;
    case 'offer': { const i = S.offers.findIndex(o => o.from === +x && o.t === y); if (i >= 0) answerOffer(i, z2 === '1'); const ts = el.closest('.ts'); if (ts) ts.remove(); if (UI.modal === 'menu') { UI.lastM = ''; renderMenu(true); } break; }

    case 'load': try { loadState(saveList()[+x].data); note('Загружено'); } catch (e) { note('Ошибка: ' + e.message); } break;
    case 'del': { const l = saveList(); l.splice(+x, 1); putSaves(l); UI.lastM = ''; renderMenu(true); break; }
    case 'export': { const ta = $('#io'); ta.value = JSON.stringify({ app: 'front-evrazii', fmt: 2, S }); ta.select(); try { navigator.clipboard.writeText(ta.value); $('#iomsg').textContent = 'Скопировано в буфер'; } catch (e) { $('#iomsg').textContent = 'Скопируйте текст вручную'; } return; }
    case 'import': try { loadState($('#io').value.trim()); note('Загружено'); } catch (e) { $('#iomsg').textContent = 'Ошибка: ' + e.message; } return;
    case 'sndmode': { const m = [[1, 1], [1, 0], [0, 0]][+x]; SETTINGS.sound = !!m[0]; saveSettings(); SFX.init(); SFX.music(!!m[1]); UI.lastM = ''; renderMenu(true); break; }

    case 'names': SETTINGS.names = !SETTINGS.names; saveSettings(); UI.lastM = ''; renderMenu(true); break;

function cityFromXY(x, y) { const bx = V.x + x / V.z, by = V.y + y / V.z; let ci = cityNear(bx, by, Math.max(7, 12 / V.z)); if (ci < 0) ci = regionAt(bx, by); return ci; }

  const ci = cityFromXY(x, y);
  if (!S) { if (ci >= 0) { UI.pick = W.C0[ci].f; UI.keepScroll = 1; renderMenu(); } return; }
  const p = S.player;
  if (UI.mode && UI.mode.t === 'move') { if (ci < 0 || ci === UI.mode.from) { UI.mode = null; refresh(true); return; } if (trySend(UI.mode.from, ci, UI.share)) { UI.mode = null; refresh(true); } return; }
  if (right) { if (ci >= 0 && UI.sel >= 0 && S.C[UI.sel].o === p && ci !== UI.sel) trySend(UI.sel, ci, 1); return; }
  selectCity(ci);
}
function initInput() {
  const ptr = new Map(); let moved = 0, pinch = 0, lastTap = 0;
  cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); ptr.set(e.pointerId, { x: e.clientX, y: e.clientY, b: e.button }); if (ptr.size === 1) moved = 0; if (ptr.size === 2) { const [a, b] = [...ptr.values()]; pinch = Math.hypot(a.x - b.x, a.y - b.y); } SFX.init(); });
  cv.addEventListener('pointermove', e => {
    const pt = ptr.get(e.pointerId), px = SETTINGS.px;
    if (!pt) { const [x, y] = evXY(e); UI.hover = S ? cityFromXY(x, y) : -1; return; }
    const dx = e.clientX - pt.x, dy = e.clientY - pt.y; pt.x = e.clientX; pt.y = e.clientY;
    if (ptr.size === 1) { moved += Math.abs(dx) + Math.abs(dy); if (moved > 6) { V.x -= dx / px / V.z; V.y -= dy / px / V.z; clampView(); } }
    else if (ptr.size === 2) { const [a, b] = [...ptr.values()], d = Math.hypot(a.x - b.x, a.y - b.y), r = cv.getBoundingClientRect(); if (pinch > 0) zoomAt(((a.x + b.x) / 2 - r.left) / px, ((a.y + b.y) / 2 - r.top) / px, d / pinch); pinch = d; moved = 99; }
  });
  const up = e => { const pt = ptr.get(e.pointerId); if (!pt) return; ptr.delete(e.pointerId); if (e.type === 'pointerup' && moved <= 6 && ptr.size === 0) { const [x, y] = evXY(e); mapClick(x, y, pt.b === 2); } };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('contextmenu', e => e.preventDefault());
  cv.addEventListener('wheel', e => { e.preventDefault(); const [x, y] = evXY(e); zoomAt(x, y, e.deltaY < 0 ? 1.25 : .8); }, { passive: false });
  document.addEventListener('click', e => { const t = e.target.closest('[data-a]'); if (t && !t.classList.contains('off')) { act(t.dataset.a, t); return; } const ts = e.target.closest('.ts'); if (ts && ts.dataset.c && S) { focusCity(+ts.dataset.c, 3); selectCity(+ts.dataset.c); ts.remove(); } });
  document.addEventListener('pointerdown', e => { if (e.target.closest('#panel,#modal')) UI.held = true; }, true);
  document.addEventListener('pointerup', () => { setTimeout(() => { UI.held = false; }, 60); }, true);
  document.addEventListener('pointercancel', () => { UI.held = false; }, true);
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal' && S && UI.modal === 'menu') closeModal(); });
  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT' || !S) return;
    if (e.code === 'Space') { e.preventDefault(); if (UI.modal) return; S.speed = S.speed ? 0 : (UI.prevSp || 1); }
    else if (e.key >= '1' && e.key <= '3') { if (!UI.modal) S.speed = +e.key; }
    else if (e.key === 'Escape') { if (UI.modal === 'menu') closeModal(); else if (UI.mode) UI.mode = null; else UI.sel = -1; }
    else if (e.key === 'm' || e.key === 'ь' || e.key === 'M') { UI.modal ? closeModal() : openMenu(); }
    else return; if (S.speed) UI.prevSp = S.speed; refresh(true);
  });
  window.addEventListener('resize', resize);
}

// ---------- запуск ----------
let _last = 0, _ui = 0;
function loop(now) {
  requestAnimationFrame(loop); const dt = Math.min(.1, (now - _last) / 1000 || 0); _last = now;
  if (S && S.speed && !UI.modal) { let d = dt * SPEEDS[S.speed]; while (d > 0) { const s = Math.min(d, .2); advance(s); d -= s; } }
  updateFx(dt); draw(now);
  if (now - _ui > 300) { _ui = now; refresh(); }
}
function boot() {
  cv = $('#map'); ctx = cv.getContext('2d'); $('#hud').innerHTML = '<div class="chip"><span class="who">ФРОНТ ЕВРАЗИИ — строим мир…</span></div>';
  setTimeout(() => {
    buildWorld(JSON.parse($('#topo').textContent), JSON.parse($('#citydata').textContent)); initNear(); initMap(); paintAll();
    EV.owner = ci => { paintCity(ci); UI.lastP = ''; };
    EV.boom = fxBoom; EV.toast = toast;
    EV.fly = (wk) => { const w = WPN[wk]; SFX.play(w.nuke ? 'nukeLaunch' : w.cls === 'drone' ? 'drone' : 'missile'); };
    EV.over = k => showOver(k);
    EV.day = day => { if (SETTINGS.autosave && day > 0 && day % SETTINGS.autosave === 0) doSave('Автосейв', true); };
    resize(); V.z = V.zmin / .8; V.x = (W.BW - CW / V.z) / 2; V.y = (W.BH - CH / V.z) / 2; clampView();
    initInput(); openMenu('new'); requestAnimationFrame(loop);
  }, 30);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
